services:
  app:
    image: yush7/backend:latest
    container_name: backend-app
    env_file:
      - .env.prod
    ports:
      - "80:8080"
    depends_on:
      - backend-mysql
    restart: unless-stopped
    networks:
      - backend-network

  backend-mysql:
    image: mysql:8.0.43
    container_name: backend-mysql
    env_file:
      - .env.prod
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./_vol/mysql:/var/lib/mysql
    restart: unless-stopped
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge