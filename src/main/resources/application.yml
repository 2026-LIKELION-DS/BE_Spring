server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://springboot-mysql:3306/springboot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
    username: admin
    password: admin1234!
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    net.likelion: DEBUG

springdoc:
  swagger-ui:
    path: /swagger
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

jwt:
  secret: this-is-very-long-secret-key-for-likelion-14th-session-test
  expiration: 86400000  # 24시간 (ms)