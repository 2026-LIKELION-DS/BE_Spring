name: CI/CD

on:
  push:
    branches: [ "main" ] # main 브랜치에 push하면 자동 실행
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Actions 서버로 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Docker Buildx 준비 (멀티 아키텍처 빌드용)
      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 이미지 태그 변수 설정
      - name: Prepare image tags
        id: prep
        run: |
          IMAGE_NS="${{ secrets.DOCKERHUB_USERNAME }}"
          IMAGE_NAME="backend-app"
          IMAGE="${IMAGE_NS}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag_latest=${IMAGE}:latest" >> $GITHUB_OUTPUT
          echo "tag_sha=${IMAGE}:${SHORT_SHA}" >> $GITHUB_OUTPUT

      # 5. 멀티 아키텍처 빌드 및 도커 허브 푸시
      - name: Build and Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.prep.outputs.tag_latest }}
            ${{ steps.prep.outputs.tag_sha }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.tag_latest }}
          cache-to: type=inline

      # 6. EC2에 SSH 접속 후 배포 (pull & up -d)
      - name: Deploy on EC2 (pull & up -d)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /srv/backend/deploy
            echo "[1/3] pull"
            sudo docker compose -f docker-compose.prod.yml pull
            echo "[2/3] up -d"
            sudo docker compose -f docker-compose.prod.yml up -d
            echo "[3/3] prune"
            sudo docker image prune -f
            echo "Deploy done."